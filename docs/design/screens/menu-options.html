<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Notas — menu de opções</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F4F5}
a{color:#1D4FC4}a:hover{color:#163C96}
button{font:inherit;cursor:pointer}
.ck{position:relative;display:flex;align-items:center;gap:10px;cursor:pointer}
.ck input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.ck-box{width:16px;height:16px;flex-shrink:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border:1.5px solid #D4D4D8;border-radius:5px;background:#FFFFFF;transition:background-color .12s,border-color .12s}
.ck-box svg{width:10px;height:10px;fill:none;stroke:#FFFFFF;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .12s}
.ck:hover .ck-box{border-color:#A1A1AA}
.ck input:checked+.ck-box{background:#18181B;border-color:#18181B}
.ck input:checked+.ck-box svg{opacity:1}
.ck input:focus-visible+.ck-box{outline:2px solid #2F6FEB;outline-offset:2px}
.ck:has(input:checked){color:#6B6B73}
ul li::marker{color:#52525B;font-size:1.2em}
.sw{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;height:30px;padding:0 10px;border-radius:8px;cursor:pointer;font-size:13.5px;color:#18181B}
.sw:hover{background:#F4F4F5}
.sw input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.sw-track{position:relative;width:28px;height:16px;flex-shrink:0;box-sizing:border-box;border-radius:999px;background:#D4D4D8;transition:background-color .15s}
.sw-track::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(24,24,27,0.2);transition:transform .15s}
.sw input:checked+.sw-track{background:#18181B}
.sw input:checked+.sw-track::after{transform:translateX(12px)}
.sw input:focus-visible+.sw-track{outline:2px solid #2F6FEB;outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-button{display:none}
::-webkit-scrollbar-thumb{background-color:transparent;border:3px solid transparent;background-clip:padding-box;border-radius:999px}
:hover::-webkit-scrollbar-thumb{background-color:rgba(24,24,27,0.16)}
::-webkit-scrollbar-thumb:hover{background-color:rgba(24,24,27,0.3)}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:transparent transparent}*:hover{scrollbar-color:rgba(24,24,27,0.16) transparent}}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 780px; display: flex; flex-direction: column; background: #FFFFFF; color: #18181B; font-family: Geist, 'Segoe UI', system-ui, sans-serif; font-size: 14px; box-sizing: border-box; overflow: hidden; border: 1px solid #E4E4E7; border-radius: 14px">

  <header style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding-left: 12px">
    <button aria-label="Mostrar lista de notas" style="width: 36px; height: 34px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: #52525B">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="3.5"></rect><path d="M7.5 3.5v13"></path></svg>
    </button>
    <sc-if value="{{quick}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; align-items: center; gap: 2px; padding: 3px; margin-left: 4px; background: #F4F4F5; border-radius: 999px">
        <button aria-label="Formatação de texto" style="height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: #52525B; font-size: 14px; font-weight: 500">Aa</button>
        <button aria-label="Checklist" style="width: 34px; height: 30px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: transparent; color: #52525B"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 5 1.5 1.5L7 4"></path><path d="M10 5.5h7"></path><path d="m3 12 1.5 1.5L7 11"></path><path d="M10 12.5h7"></path></svg></button>
        <button aria-label="Tabela" style="width: 34px; height: 30px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: transparent; color: #52525B"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="3"></rect><path d="M3 8.5h14M8 4v12"></path></svg></button>
      </div>
    </sc-if>
    <span style="font-size: 12.5px; color: #6B6B73; margin-left: 12px; white-space: nowrap">Sex, 30 de outubro · 12:29</span>
    <div style="flex: 1 1 0"></div>
    <div style="display: flex; align-items: center; gap: 2px; margin-right: 14px">
      <sc-if value="{{pin}}" hint-placeholder-val="{{true}}">
        <button aria-label="Fixar nota" style="width: 36px; height: 34px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: #52525B"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h6l-1 5 3 3H5l3-3z"></path><path d="M10 11v6"></path></svg></button>
      </sc-if>
      <button aria-label="Mais opções" aria-expanded="true" style="width: 36px; height: 34px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: #F4F4F5; color: #18181B"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="5" cy="10" r="1.3" fill="currentColor"></circle><circle cx="10" cy="10" r="1.3" fill="currentColor"></circle><circle cx="15" cy="10" r="1.3" fill="currentColor"></circle></svg></button>
      <sc-if value="{{nova}}" hint-placeholder-val="{{true}}">
        <button aria-label="Nova nota" title="Nova nota (Ctrl T)" style="width: 32px; height: 32px; margin-left: 8px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 999px; background: #18181B; color: #FFFFFF">
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11"></path></svg>
        </button>
      </sc-if>
    </div>
    <div style="display: flex; align-self: stretch">
      <button aria-label="Minimizar" style="width: 46px; border: 0; background: transparent; color: #18181B; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M3 10h14"></path></svg></button>
      <button aria-label="Maximizar" style="width: 46px; border: 0; background: transparent; color: #18181B; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3.5" y="3.5" width="13" height="13" rx="3"></rect></svg></button>
      <button aria-label="Fechar" style="width: 46px; border: 0; background: transparent; color: #18181B; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="m4 4 12 12M16 4 4 16"></path></svg></button>
    </div>
  </header>

  <div style="flex: 1 1 0; min-height: 0; overflow: auto">
    <article style="padding: 36px 48px; box-sizing: border-box; font-size: 15.5px; line-height: 1.75; color: #27272A">
      <p style="margin: 0 0 18px">Um app de notas que abre na hora e não atrapalha. Sem título obrigatório: se eu não escrever um, a nota leva a data e a hora.</p>
      <div style="display: flex; flex-direction: column; gap: 2px; margin-bottom: 22px">
        <label class="ck"><input type="checkbox" checked="{{yes}}"><span class="ck-box" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.5l4.5-5"></path></svg></span>White mode primeiro</label>
        <label class="ck"><input type="checkbox"><span class="ck-box" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.5l4.5-5"></path></svg></span>Notas sem título usam data e hora</label>
        <label class="ck"><input type="checkbox"><span class="ck-box" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.5l4.5-5"></path></svg></span>Lista organizada por semana, sozinha</label>
        <label class="ck"><input type="checkbox"><span class="ck-box" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.5l4.5-5"></path></svg></span>Dark mode depois</label>
      </div>
      <p style="margin: 0 0 4px; font-weight: 600">Atalhos</p>
      <ul style="margin: 0; padding-left: 20px">
        <li>Ctrl + T — nova nota</li>
        <li>Ctrl + \ — mostrar ou esconder a lista</li>
      </ul>
    </article>
  </div>

  <div role="menu" aria-label="Opções" style="position: absolute; top: 50px; right: {{menuRight}}px; width: 288px; box-sizing: border-box; padding: 6px; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 14px; box-shadow: 0 16px 40px rgba(24,24,27,0.12), 0 2px 6px rgba(24,24,27,0.05)">
    <div style="padding: 6px 10px 2px; font-size: 12px; font-weight: 500; color: #6B6B73">Layout</div>
    <label class="sw"><span>Mostrar ações rápidas</span><input type="checkbox" role="switch" checked="{{quick}}" onChange="{{toggleQuick}}"><span class="sw-track" aria-hidden="true"></span></label>
    <label class="sw"><span>Mostrar botão fixar</span><input type="checkbox" role="switch" checked="{{pin}}" onChange="{{togglePin}}"><span class="sw-track" aria-hidden="true"></span></label>
    <label class="sw"><span>Mostrar botão nova nota</span><input type="checkbox" role="switch" checked="{{nova}}" onChange="{{toggleNova}}"><span class="sw-track" aria-hidden="true"></span></label>

    <div style="height: 1px; margin: 6px 4px; background: #EFEFF1"></div>

    <div style="padding: 6px 10px 2px; font-size: 12px; font-weight: 500; color: #6B6B73">Atalhos</div>
    <div style="height: 30px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 10px; font-size: 13.5px">
      <span>Nova nota</span>
      <span style="display: flex; gap: 4px">
        <kbd style="font-family: inherit; font-size: 11.5px; font-weight: 500; line-height: 20px; min-width: 20px; text-align: center; padding: 0 6px; box-sizing: border-box; color: #52525B; background: #F4F4F5; border-radius: 6px">Ctrl</kbd>
        <kbd style="font-family: inherit; font-size: 11.5px; font-weight: 500; line-height: 20px; min-width: 20px; text-align: center; padding: 0 6px; box-sizing: border-box; color: #52525B; background: #F4F4F5; border-radius: 6px">T</kbd>
      </span>
    </div>
    <div style="height: 30px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 10px; font-size: 13.5px">
      <span>Mostrar / Esconder sidebar</span>
      <span style="display: flex; gap: 4px">
        <kbd style="font-family: inherit; font-size: 11.5px; font-weight: 500; line-height: 20px; min-width: 20px; text-align: center; padding: 0 6px; box-sizing: border-box; color: #52525B; background: #F4F4F5; border-radius: 6px">Ctrl</kbd>
        <kbd style="font-family: inherit; font-size: 11.5px; font-weight: 500; line-height: 20px; min-width: 20px; text-align: center; padding: 0 6px; box-sizing: border-box; color: #52525B; background: #F4F4F5; border-radius: 6px">\</kbd>
      </span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const quick = s.quick !== false;
    const pin = s.pin !== false;
    const nova = s.nova !== false;
    return {
      yes: true,
      quick: quick,
      pin: pin,
      nova: nova,
      menuRight: 138 + 14 + (nova ? 40 : 0),
      toggleQuick: () => this.setState({ quick: !quick }),
      togglePin: () => this.setState({ pin: !pin }),
      toggleNova: () => this.setState({ nova: !nova })
    };
  }
}
</script>
</body>
</html>
